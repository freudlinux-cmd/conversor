<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freud Money Convert</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="imagens/freud-32.png">
    <link rel="icon" type="image/png" sizes="32x32" href="imagens/freud-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="imagens/freud-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="imagens/freud-180.png">
    <link rel="manifest" href="manifest.json">
    <link rel="shortcut icon" href="/favicon.ico">
    <meta name="theme-color" content="#ffffff">
    <meta name="msapplication-TileColor" content="#ffffff">
    <meta name="msapplication-TileImage" content="imagens/freud-192.png">
</head>
<body>
    <button type="button" id="themeToggle" onclick="toggleTheme()">Modo Escuro</button>
    <div class="centro">
        <h1>Freud Money Convert</h1>
        <select id="moedaOrigem" class="select">
            <option value="BRL">Real (BRL)</option>
            <option value="USD">Dólar (USD)</option>
            <option value="EUR">Euro (EUR)</option>
            <option value="GBP">Libra Esterlina (GBP)</option>
            <option value="JPY">Iene Japonês (JPY)</option>
        </select>
        <select id="moedaDestino" class="select">
            <option value="USD">Dólar (USD)</option>
            <option value="EUR">Euro (EUR)</option>
            <option value="GBP">Libra Esterlina (GBP)</option>
            <option value="JPY">Iene Japonês (JPY)</option>
            <option value="BRL">Real (BRL)</option>
        </select>
        <input type="number" placeholder="Valor" id="valor" class="input" step="any">
        <input type="text" placeholder="Resultado" id="resultado" class="input" readonly>
        <button type="button" onclick="converter()">Converter</button>
        <button type="button" id="toggleButton" onclick="toggleMode()">Inverter</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
